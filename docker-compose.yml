name: juniorswipe

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juniorswipe
      POSTGRES_PASSWORD: juniorswipe
      POSTGRES_DB: juniorswipe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juniorswipe -d juniorswipe"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [juniorswipe]

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://juniorswipe:juniorswipe@db:5432/juniorswipe
      SECRET_KEY: docker-dev-secret
      JWT_SECRET: docker-dev-jwt-secret
      JWT_EXPIRES_SECONDS: "3600"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost"
      SEED_ON_STARTUP: "true"
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [juniorswipe]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [juniorswipe]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [backend]
    networks: [juniorswipe]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [juniorswipe]

volumes:
  pgdata:
  storage:
  grafana:

networks:
  juniorswipe:
    driver: bridge
