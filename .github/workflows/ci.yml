name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 app
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: juniorswipe
          POSTGRES_PASSWORD: juniorswipe
          POSTGRES_DB: juniorswipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U juniorswipe"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with postgres driver)
        working-directory: backend
        run: pip install -r requirements-postgres.txt
      - name: Start API against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://juniorswipe:juniorswipe@localhost:5432/juniorswipe
          JWT_SECRET: ci-secret
          SEED_ON_STARTUP: "true"
        run: |
          nohup python -m gunicorn --bind 0.0.0.0:5000 wsgi:app &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && break || sleep 2
          done
          curl -sf http://localhost:5000/api/health
      - name: Run Postman collection (newman)
        run: |
          npx --yes newman run postman/JuniorSwipe.postman_collection.json \
            --env-var baseUrl=http://localhost:5000

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: juniorswipe-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: juniorswipe-frontend:ci
      - name: Validate docker-compose
        run: docker compose config -q
